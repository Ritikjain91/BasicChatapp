services:
  - type: web
    name: pulsechat-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/server.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: "*"
      - key: DB_PATH
        value: ./data/chat.db
